<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>生成图标</title></head>
<body style="background:#0f0c29;color:#fff;font-family:sans-serif;padding:20px;">
<h2>🗡️ 神剑仙域 PWA 图标生成器</h2>
<p>打开此页面后，图标会自动下载。下载完成后可关闭此页面。</p>
<div id="status"></div>
<canvas id="c192" width="192" height="192" style="border:2px solid #ffd700;margin:5px;"></canvas>
<canvas id="c512" width="512" height="512" style="border:2px solid #ffd700;margin:5px;"></canvas>
<script>
function drawSword(canvas, size) {
    const ctx = canvas.getContext('2d');
    // 背景渐变
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#0f0c29');
    grad.addColorStop(0.5, '#302b63');
    grad.addColorStop(1, '#24243e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    // 外圈
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = size * 0.04;
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2 - size*0.06, 0, Math.PI * 2);
    ctx.stroke();
    // 剑身
    const cx = size/2, cy = size/2;
    const sl = size * 0.55, sw = size * 0.08;
    ctx.fillStyle = '#e0e0e0';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = size * 0.08;
    ctx.beginPath();
    ctx.moveTo(cx-sw/2, cy+sl*0.35);
    ctx.lineTo(cx+sw/2, cy+sl*0.35);
    ctx.lineTo(cx+sw*0.3, cy-sl*0.4);
    ctx.lineTo(cx-sw*0.3, cy-sl*0.4);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 剑柄
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(cx-sw*0.6, cy+sl*0.35, sw*1.2, sl*0.15);
    // 护手
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(cx-sw*1.2, cy+sl*0.3, sw*2.4, sw*0.25);
    // 剑尖
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(cx, cy-sl*0.45, size*0.04, 0, Math.PI*2);
    ctx.fill();
    // 粒子
    ctx.fillStyle = 'rgba(255,215,0,0.6)';
    for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2;
        const d = sl*0.5 + Math.random()*size*0.12;
        ctx.beginPath();
        ctx.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, size*(0.01+Math.random()*0.02), 0, Math.PI*2);
        ctx.fill();
    }
}

function download(canvas, filename) {
    canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }, 'image/png');
}

drawSword(document.getElementById('c192'), 192);
drawSword(document.getElementById('c512'), 512);

// 自动下载
setTimeout(() => {
    download(document.getElementById('c192'), 'icon-192.png');
    setTimeout(() => download(document.getElementById('c512'), 'icon-512.png'), 500);
    document.getElementById('status').innerHTML = '<p style="color:#4fd1c7;margin-top:10px;">✅ 图标已下载！请把 icon-192.png 和 icon-512.png 放到与 index.html 同级的目录。</p>';
}, 300);
</script>
</body></html>
